name: Build TikTok Live Overlay v4 RTMP APK

on:
  push:
    branches: ["chatgpt-tiktok-live-overlay"]
    paths:
      - 'overlayv4_patch*.txt'
      - '.github/workflows/build-tiktok-overlay-v4.yml'
  workflow_dispatch:

jobs:
  build-overlay-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct v3 source
        run: |
          cat b64chunk*.txt | base64 -d > TikTokBotBase.zip
          mkdir -p project
          unzip -q TikTokBotBase.zip -d project
          cat overlayv1_patch*.txt | base64 -d | gzip -d > overlay_v1.patch
          cd project
          patch -p4 < ../overlay_v1.patch
          cd ..
          base64 -d overlayv1_fix.b64 | gzip -d > overlay_v1_fix.patch
          cd project
          patch -p1 < ../overlay_v1_fix.patch
          cd ..
          cat overlayv2_patch*.txt | base64 -d | gzip -d > overlay_v2.patch
          cd project
          patch -p4 < ../overlay_v2.patch || true
          cd ..
          base64 -d overlayv3_patch.b64 | gzip -d > overlay_v3.patch
          cd project
          patch -p2 < ../overlay_v3.patch
          grep -q 'versionCode 3' app/build.gradle
          grep -q 'SceneEditorActivity' app/src/main/AndroidManifest.xml
          cd ..

      - name: Apply v4 editor + RTMP patch
        run: |
          cat overlayv4_patch*.txt | base64 -d | gzip -d > overlay_v4.patch
          echo "27d6a4e5a7a8b828bdfd0b47d7f58005854e99df69d3728608583e16e79401c6  overlay_v4.patch" | sha256sum -c -
          cd project
          patch -p2 < ../overlay_v4.patch
          sed -i "s/RootEncoder:library:2.8.0/RootEncoder:library:2.5.9/" app/build.gradle
          grep -q 'versionCode 4' app/build.gradle
          grep -q 'RootEncoder:library:2.5.9' app/build.gradle
          grep -q 'ACTION_START_RTMP' app/src/main/java/com/tiktokbot/lite/SceneCaptureService.java
          grep -q 'INICIAR LIVE RTMP' app/src/main/java/com/tiktokbot/lite/SceneEditorActivity.java

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Verify and rename APK
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk TikTokLiveOverlay_v4_RTMP.apk
          unzip -t TikTokLiveOverlay_v4_RTMP.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TikTokLiveOverlay_v4_RTMP.apk | grep "package: name='com.tiktokoverlay.live'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree TikTokLiveOverlay_v4_RTMP.apk AndroidManifest.xml | grep -q 'RECORD_AUDIO'
          ls -lh TikTokLiveOverlay_v4_RTMP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokLiveOverlay-v4-RTMP-APK
          path: TikTokLiveOverlay_v4_RTMP.apk
          retention-days: 7
