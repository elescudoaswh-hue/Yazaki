name: Build TikTokBot v5 Gift Fix

on:
  push:
    branches: ["chatgpt-tiktokbot-v5-giftfix"]
    paths:
      - '.github/workflows/build-tiktokbot-v5-giftfix.yml'
  workflow_dispatch:

jobs:
  build-v5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct v4 source
        run: |
          cat v4chunk00.txt v4chunk01.txt v4chunk02.txt v4chunk03.txt v4chunk04.txt v4chunk05.txt v4chunk06.txt v4chunk07.txt v4chunk08.txt | tr -d '\r\n' | base64 -d > source-v4-good.zip
          unzip -q source-v4-good.zip -d TikTokBot_Android_Lite_v5
          test -f TikTokBot_Android_Lite_v5/settings.gradle

      - name: Apply gift sound correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('TikTokBot_Android_Lite_v5')
          gradle = root / 'app/build.gradle'
          live = root / 'app/src/main/java/com/tiktokbot/lite/LiveService.java'
          layout = root / 'app/src/main/res/layout/activity_main.xml'

          s = gradle.read_text()
          s = s.replace('versionCode 4', 'versionCode 5').replace('versionName "4.0"', 'versionName "5.0"')
          gradle.write_text(s)

          s = live.read_text()
          old = '''    private void handleGift(EventParser.Event e) {\n        String gift = e.gift == null ? "regalo" : e.gift;\n        broadcast("REGALO", safeUser(e.user) + " x" + e.count + " " + gift);\n        if (!prefs.getBoolean("sound_gift", true)) return;\n\n        int threshold = prefs.getInt("gift_special_threshold", 5);\n        boolean namedSpecial = specialGiftNames.contains(FilterEngine.normalize(gift));\n        boolean special = e.count >= threshold || namedSpecial;\n        if (special) playSoundKey("special", effectVolume("vol_gift", 75));\n        else playSoundKey("gift", effectVolume("vol_gift", 75));\n    }'''
          new = '''    private void handleGift(EventParser.Event e) {\n        String gift = e.gift == null ? "regalo" : e.gift;\n        broadcast("REGALO", safeUser(e.user) + " x" + e.count + " " + gift);\n        if (!prefs.getBoolean("sound_gift", true)) return;\n\n        // Todo regalo reproduce siempre el sonido general.\n        final float volume = effectVolume("vol_gift", 75);\n        playSoundKey("gift", volume);\n\n        // El sonido especial SOLO depende de la lista de nombres especiales.\n        // La cantidad de unidades ya no convierte un regalo normal en especial.\n        boolean namedSpecial = specialGiftNames.contains(FilterEngine.normalize(gift));\n        if (namedSpecial) {\n            handler.postDelayed(() -> playSoundKey("special", volume), 350L);\n        }\n    }'''
          if old not in s:
              raise SystemExit('handleGift original no encontrado')
          s = s.replace(old, new)
          s = s.replace('case "special": soundId = soundSpecial != 0 ? soundSpecial : soundGift; break;',
                        'case "special": soundId = soundSpecial; break;')
          live.write_text(s)

          s = layout.read_text()
          s = s.replace('android:hint="Cantidad para regalo especial (ej. 5)"',
                        'android:hint="Cantidad especial desactivada"\n            android:visibility="gone"')
          s = s.replace('android:hint="Nombres de regalos especiales, uno por línea (opcional)"',
                        'android:hint="Nombres de regalos especiales, uno por línea"')
          layout.write_text(s)
          PY

          grep -q 'versionCode 5' TikTokBot_Android_Lite_v5/app/build.gradle
          grep -q 'Todo regalo reproduce siempre el sonido general' TikTokBot_Android_Lite_v5/app/src/main/java/com/tiktokbot/lite/LiveService.java
          grep -q 'case "special": soundId = soundSpecial; break;' TikTokBot_Android_Lite_v5/app/src/main/java/com/tiktokbot/lite/LiveService.java

      - name: Build debug APK v5
        working-directory: TikTokBot_Android_Lite_v5
        run: gradle assembleDebug --stacktrace

      - name: Verify and rename APK
        run: |
          cp TikTokBot_Android_Lite_v5/app/build/outputs/apk/debug/app-debug.apk TikTokBotLite_v5_RegalosCorregidos.apk
          unzip -t TikTokBotLite_v5_RegalosCorregidos.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TikTokBotLite_v5_RegalosCorregidos.apk | grep "package: name='com.tiktokbot.lite'"
          ls -lh TikTokBotLite_v5_RegalosCorregidos.apk

      - name: Upload APK v5
        uses: actions/upload-artifact@v4
        with:
          name: TikTokBotLite-v5-RegalosCorregidos-APK
          path: TikTokBotLite_v5_RegalosCorregidos.apk
          retention-days: 7
