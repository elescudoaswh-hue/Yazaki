name: Export CODM Crosshair v12 source

on:
  push:
    branches: ["chatgpt-codm-crosshair-build"]
  workflow_dispatch:

jobs:
  export-v12-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode v8 base
        run: |
          cat v8small*.txt | base64 -d > CODMCrosshair_Auto_v8_source.zip
          echo "7b15f38ad087954b9bd46adfd0da6af7a0b9f9ecfc2d05bb495ca38a31cd2ace  CODMCrosshair_Auto_v8_source.zip" | sha256sum -c -
          unzip -q CODMCrosshair_Auto_v8_source.zip

      - name: Apply v9
        run: |
          base64 -d v9patch.b64 | gzip -d > v9.patch
          patch -p1 < v9.patch

      - name: Apply v10
        run: |
          base64 -d v10patch.b64 | gzip -d > v10.patch
          patch -p1 < v10.patch

      - name: Apply v11
        run: |
          base64 -d v11patch.b64 | gzip -d > v11.patch
          patch -p1 < v11.patch

      - name: Apply v12
        run: patch -p1 < v12_fixed.patch

      - name: Archive source
        run: zip -qr CODMCrosshair_Auto_v12_source.zip CODMCrosshair_Auto

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CODMCrosshair-Auto-v12-source
          path: CODMCrosshair_Auto_v12_source.zip
          retention-days: 2
