name: Build TikTokBot APK

on:
  push:
    branches: ["chatgpt-tiktokbot-apk-build"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android v3 project
        run: |
          cat v3c00.txt v3c01.txt v3c02.txt v3c03.txt v3c04.txt v3c05.txt v3c06.txt v3c07.txt | tr -d '\r\n' | base64 -d > source-v3.zip
          unzip -q source-v3.zip -d TikTokBot_Android_Lite_v3
          test -f TikTokBot_Android_Lite_v3/settings.gradle

      - name: Build debug APK v3
        working-directory: TikTokBot_Android_Lite_v3
        run: gradle assembleDebug --stacktrace

      - name: Rename APK v3
        run: cp TikTokBot_Android_Lite_v3/app/build/outputs/apk/debug/app-debug.apk TikTokBotLite_v3.apk

      - name: Upload APK v3
        uses: actions/upload-artifact@v4
        with:
          name: TikTokBotLite-v3-APK
          path: TikTokBotLite_v3.apk
          retention-days: 7
