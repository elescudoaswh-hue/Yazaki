name: Build TikTokBot APK

on:
  push:
    branches: ["chatgpt-tiktokbot-apk-build"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android v4 project
        run: |
          unzip -q source-v4.zip -d TikTokBot_Android_Lite_v4
          test -f TikTokBot_Android_Lite_v4/settings.gradle

      - name: Build debug APK v4
        working-directory: TikTokBot_Android_Lite_v4
        run: gradle assembleDebug --stacktrace

      - name: Rename APK v4
        run: cp TikTokBot_Android_Lite_v4/app/build/outputs/apk/debug/app-debug.apk TikTokBotLite_v4.apk

      - name: Upload APK v4
        uses: actions/upload-artifact@v4
        with:
          name: TikTokBotLite-v4-APK
          path: TikTokBotLite_v4.apk
          retention-days: 7
