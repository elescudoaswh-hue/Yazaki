name: Build TikTokBot APK

on:
  push:
    branches: ["chatgpt-tiktokbot-apk-build"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android v2 project
        run: |
          cat v2chunk00.txt v2chunk01.txt v2chunk02.txt v2chunk03.txt v2chunk04.txt v2chunk05.txt v2chunk06.txt v2chunk07.txt v2chunk08.txt | tr -d '\r\n' | base64 -d > source-v2.zip
          unzip -q source-v2.zip -d TikTokBot_Android_Lite_v2
          test -f TikTokBot_Android_Lite_v2/settings.gradle

      - name: Build debug APK v2
        working-directory: TikTokBot_Android_Lite_v2
        run: gradle assembleDebug --stacktrace

      - name: Rename APK v2
        run: cp TikTokBot_Android_Lite_v2/app/build/outputs/apk/debug/app-debug.apk TikTokBotLite_v2.apk

      - name: Upload APK v2
        uses: actions/upload-artifact@v4
        with:
          name: TikTokBotLite-v2-APK
          path: TikTokBotLite_v2.apk
          retention-days: 7
