name: Build TikTok Live Overlay v2 APK

on:
  push:
    branches: ["chatgpt-tiktok-live-overlay"]
    paths:
      - 'overlayv2_patch*.txt'
      - '.github/workflows/build-tiktok-overlay-v2.yml'
  workflow_dispatch:

jobs:
  build-overlay-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct v1 source
        run: |
          cat b64chunk*.txt | base64 -d > TikTokBotBase.zip
          mkdir -p project
          unzip -q TikTokBotBase.zip -d project
          cat overlayv1_patch*.txt | base64 -d | gzip -d > overlay_v1.patch
          cd project
          patch -p4 < ../overlay_v1.patch
          cd ..
          base64 -d overlayv1_fix.b64 | gzip -d > overlay_v1_fix.patch
          cd project
          patch -p1 < ../overlay_v1_fix.patch
          cd ..

      - name: Apply v2 circular chat patch
        run: |
          cat overlayv2_patch*.txt | base64 -d | gzip -d > overlay_v2.patch
          echo "4e9227baf21c23ced5a4dede605137f780f37c3f2650e06033e0bcf44959f1f8  overlay_v2.patch" | sha256sum -c -
          cd project
          # One final notification-only hunk differs from the v1 reconstruction.
          # Apply all functional hunks and allow that cosmetic hunk to reject.
          patch -p4 < ../overlay_v2.patch || true
          grep -q 'versionCode 2' app/build.gradle
          grep -q 'ACTION_TOGGLE_CHAT' app/src/main/java/com/tiktokbot/lite/LiveService.java
          grep -q 'chat_bubble_dp' app/src/main/java/com/tiktokbot/lite/MainActivity.java
          grep -q 'showChatPreview' app/src/main/java/com/tiktokbot/lite/LiveService.java
          grep -q 'statsPanel' app/src/main/java/com/tiktokbot/lite/LiveService.java

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Verify and rename APK
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk TikTokLiveOverlay_v2.apk
          unzip -t TikTokLiveOverlay_v2.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TikTokLiveOverlay_v2.apk | grep "package: name='com.tiktokoverlay.live'"
          ls -lh TikTokLiveOverlay_v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokLiveOverlay-v2-APK
          path: TikTokLiveOverlay_v2.apk
          retention-days: 7
