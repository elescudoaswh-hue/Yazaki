name: Build TikTok Live Overlay v1 APK

on:
  push:
    branches: ["chatgpt-tiktok-live-overlay"]
    paths:
      - 'overlayv1_patch*.txt'
      - 'overlayv1_fix.b64'
      - '.github/workflows/build-tiktok-overlay-v1.yml'
  workflow_dispatch:

jobs:
  build-overlay-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct base Android project
        run: |
          cat b64chunk*.txt | base64 -d > TikTokBotBase.zip
          mkdir -p project
          unzip -q TikTokBotBase.zip -d project
          test -f project/app/src/main/java/com/tiktokbot/lite/LiveService.java

      - name: Apply TikTok Overlay v1
        run: |
          cat overlayv1_patch*.txt | base64 -d | gzip -d > overlay_v1.patch
          echo "b1ae86896de2c7f03d076f82bb287f89f82c90fab1bdb0308d4c7fbccf0f496c  overlay_v1.patch" | sha256sum -c -
          cd project
          patch -p4 < ../overlay_v1.patch
          cd ..
          base64 -d overlayv1_fix.b64 | gzip -d > overlay_v1_fix.patch
          echo "1e60185f198adfbd933a268f6901450dfa2cef29fef40fe7ca7bfac7e2689cbd  overlay_v1_fix.patch" | sha256sum -c -
          cd project
          patch -p1 < ../overlay_v1_fix.patch
          grep -q 'applicationId "com.tiktokoverlay.live"' app/build.gradle
          grep -q 'OverlayTileService' app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Verify and rename APK
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk TikTokLiveOverlay_v1.apk
          unzip -t TikTokLiveOverlay_v1.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TikTokLiveOverlay_v1.apk | grep "package: name='com.tiktokoverlay.live'"
          ls -lh TikTokLiveOverlay_v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokLiveOverlay-v1-APK
          path: TikTokLiveOverlay_v1.apk
          retention-days: 7
