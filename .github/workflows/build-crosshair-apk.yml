name: Build CODM Crosshair APK

on:
  push:
    branches: ["chatgpt-codm-crosshair-build"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode and unpack v3 project
        run: |
          base64 -d crosshair-source-v3.b64 > crosshair-source-v3.zip
          unzip -q crosshair-source-v3.zip

      - name: Build debug APK v3
        working-directory: CODMCrosshair_Auto
        run: gradle assembleDebug --stacktrace

      - name: Rename APK v3
        run: cp CODMCrosshair_Auto/app/build/outputs/apk/debug/app-debug.apk CODMCrosshair_Auto_v3.apk

      - name: Upload APK v3
        uses: actions/upload-artifact@v4
        with:
          name: CODMCrosshair-Auto-v3-APK
          path: CODMCrosshair_Auto_v3.apk
          retention-days: 7
