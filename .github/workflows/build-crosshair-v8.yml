name: Build CODM Crosshair v8 APK

on:
  push:
    branches: ["chatgpt-codm-crosshair-build"]
  workflow_dispatch:

jobs:
  build-v8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode and verify v8 source
        run: |
          cat v8c*.txt | base64 -d > CODMCrosshair_Auto_v8_source.zip
          echo "7b15f38ad087954b9bd46adfd0da6af7a0b9f9ecfc2d05bb495ca38a31cd2ace  CODMCrosshair_Auto_v8_source.zip" | sha256sum -c -
          unzip -t CODMCrosshair_Auto_v8_source.zip
          unzip -q CODMCrosshair_Auto_v8_source.zip

      - name: Build debug APK v8
        working-directory: CODMCrosshair_Auto
        run: gradle assembleDebug --stacktrace

      - name: Rename APK v8
        run: cp CODMCrosshair_Auto/app/build/outputs/apk/debug/app-debug.apk CODMCrosshair_Auto_v8_FPSFix.apk

      - name: Upload APK v8
        uses: actions/upload-artifact@v4
        with:
          name: CODMCrosshair-Auto-v8-FPSFix-APK
          path: CODMCrosshair_Auto_v8_FPSFix.apk
          retention-days: 7
