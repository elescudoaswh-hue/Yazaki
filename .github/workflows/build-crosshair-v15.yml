name: Build CODM Crosshair v15 ShizukuProvider Fix

on:
  push:
    branches: ["chatgpt-codm-crosshair-build"]
  workflow_dispatch:

jobs:
  build-v15:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode v8 base
        run: |
          cat v8small*.txt | base64 -d > CODMCrosshair_Auto_v8_source.zip
          unzip -q CODMCrosshair_Auto_v8_source.zip

      - name: Apply v9
        run: |
          base64 -d v9patch.b64 | gzip -d > v9.patch
          patch -p1 < v9.patch

      - name: Apply v10
        run: |
          base64 -d v10patch.b64 | gzip -d > v10.patch
          patch -p1 < v10.patch

      - name: Apply v11
        run: |
          base64 -d v11patch.b64 | gzip -d > v11.patch
          patch -p1 < v11.patch

      - name: Apply v12
        run: patch -p1 < v12_fixed.patch

      - name: Apply v14
        run: patch -p1 < v14_shizuku_fix.patch

      - name: Apply v15 provider and status fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('CODMCrosshair_Auto/app/build.gradle')
          s = gradle.read_text()
          s = s.replace("versionCode 14", "versionCode 15")
          s = s.replace("versionName '14.0'", "versionName '15.0'")
          gradle.write_text(s)

          manifest = Path('CODMCrosshair_Auto/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'rikka.shizuku.ShizukuProvider' not in s:
              provider = '''        <provider
              android:name="rikka.shizuku.ShizukuProvider"
              android:authorities="${applicationId}.shizuku"
              android:multiprocess="false"
              android:enabled="true"
              android:exported="true"
              android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />

          '''
              marker = '        <service\n'
              if marker not in s:
                  raise SystemExit('No se encontro punto de insercion para ShizukuProvider')
              s = s.replace(marker, provider + marker, 1)
          manifest.write_text(s)

          main = Path('CODMCrosshair_Auto/app/src/main/java/com/codm/crosshair/MainActivity.java')
          s = main.read_text()
          s = s.replace('CODM CROSSHAIR AUTO • v14', 'CODM CROSSHAIR AUTO • v15')
          s = s.replace('Shizuku: esperando conexión con el servicio…', 'SHIZUKU: DESCONECTADO • binder no recibido')
          s = s.replace('Shizuku: esperando binder • si ya está iniciado, se conectará solo', 'SHIZUKU: DESCONECTADO')
          s = s.replace('Shizuku: CONECTADO • lectura FPS habilitada', 'SHIZUKU: CONECTADO • FPS HABILITADO')
          s = s.replace('Shizuku: activo • falta autorizar esta APK', 'SHIZUKU: DESCONECTADO • FALTA PERMISO')
          s = s.replace('Shizuku: no detectado', 'SHIZUKU: DESCONECTADO')
          s = s.replace('Color.rgb(255, 190, 80)', 'Color.rgb(255, 80, 80)')
          main.write_text(s)
          PY

          grep -q "versionCode 15" CODMCrosshair_Auto/app/build.gradle
          grep -q "rikka.shizuku.ShizukuProvider" CODMCrosshair_Auto/app/src/main/AndroidManifest.xml
          grep -q "SHIZUKU: CONECTADO" CODMCrosshair_Auto/app/src/main/java/com/codm/crosshair/MainActivity.java

      - name: Build debug APK v15
        working-directory: CODMCrosshair_Auto
        run: gradle assembleDebug --stacktrace

      - name: Verify merged manifest has ShizukuProvider
        run: |
          MANIFEST=$(find CODMCrosshair_Auto/app/build/intermediates/merged_manifest -name AndroidManifest.xml | head -1)
          test -n "$MANIFEST"
          grep -q "rikka.shizuku.ShizukuProvider" "$MANIFEST"
          grep -q "com.codm.crosshair.shizuku" "$MANIFEST"

      - name: Rename APK v15
        run: cp CODMCrosshair_Auto/app/build/outputs/apk/debug/app-debug.apk CODMCrosshair_Auto_v15_ShizukuProviderFix.apk

      - name: Upload APK v15
        uses: actions/upload-artifact@v4
        with:
          name: CODMCrosshair-Auto-v15-ShizukuProviderFix-APK
          path: CODMCrosshair_Auto_v15_ShizukuProviderFix.apk
          retention-days: 7
